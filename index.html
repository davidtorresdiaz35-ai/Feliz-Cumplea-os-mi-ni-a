<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños!</title>
    <style>
        :root {
            --morado: #e0d4ff;
            --azul: #d4e0ff;
            --texto: #5a5a8a;
            --acento: #b39ddb;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, var(--morado), var(--azul));
            color: var(--texto);
        }

        .pantalla {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            position: absolute;
        }

        /* Pantalla 1: El Moño */
        #p1 { display: flex; z-index: 10; background: linear-gradient(135deg, var(--morado), var(--azul)); }
        
        .mono-container {
            cursor: pointer;
            transition: transform 0.5s;
        }
        .mono-container:hover { transform: scale(1.1); }
        .mono { font-size: 100px; display: block; margin-bottom: 20px; }

        /* Botones */
        .btn {
            background-color: white;
            color: var(--acento);
            border: 2px solid var(--acento);
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            animation: pulso 2s infinite;
        }

        @keyframes pulso {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(179, 157, 219, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(179, 157, 219, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(179, 157, 219, 0); }
        }

        /* Texto Máquina de Escribir */
        .texto-escribiendo {
            font-size: 1.4rem;
            max-width: 80%;
            line-height: 1.6;
            min-height: 100px;
        }

        /* Decoración Gerberas */
        .gerbera {
            position: absolute;
            font-size: 40px;
            opacity: 0.6;
        }

        /* Flashes */
        #flash-overlay {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: white;
            z-index: 100;
        }

        /* Carta Final */
        #carta {
            font-size: 1.1rem;
            text-align: left;
            background: rgba(255, 255, 255, 0.7);
            padding: 25px;
            border-radius: 15px;
            max-height: 80vh;
            overflow-y: auto;
            border-left: 5px solid var(--acento);
        }
    </style>
</head>
<body>

    <audio id="musica" src="mi-suerte.mp3"></audio>
    <div id="flash-overlay"></div>

    <div id="p1" class="pantalla">
        <div class="mono-container" onclick="iniciar()">
            <span class="mono">🎁</span>
            <button class="btn">Comenzar</button>
        </div>
    </div>

    <div id="p2" class="pantalla">
        <span class="gerbera" style="top:5%; left:5%;">🌸</span>
        <span class="gerbera" style="bottom:5%; right:5%;">🌸</span>
        <div id="texto1" class="texto-escribiendo"></div>
        <button id="btn2" class="btn" style="display:none; margin-top:30px;" onclick="paso3()">Presiona cuando estés lista</button>
    </div>

    <div id="p3" class="pantalla" style="background: black; color: white;">
        <div id="texto2" class="texto-escribiendo"></div>
        <button id="btn3" class="btn" style="display:none; margin-top:30px;" onclick="paso4()">Continuar</button>
    </div>

    <div id="p4" class="pantalla">
        <span class="gerbera" style="top:2%; right:5%;">🌸</span>
        <span class="gerbera" style="bottom:2%; left:5%;">🌸</span>
        <div id="carta" class="texto-escribiendo"></div>
    </div>

    <script>
	const musica = document.getElementById('musica');
        
        function escribir(idElemento, texto, velocidad, callback) {
            let i = 0;
            const elemento = document.getElementById(idElemento);
            elemento.innerHTML = "";
            function tipear() {
                if (i < texto.length) {
                    elemento.innerHTML += texto.charAt(i);
                    i++;
                    setTimeout(tipear, velocidad);
                } else if (callback) {
                    callback();
                }
            }
            tipear();
        }

        function iniciar() {
            // "DESPERTADOR" DE AUDIO PARA MÓVILES
            musica.play().then(() => {
                console.log("Audio iniciado correctamente");
            }).catch(error => {
                // Si el navegador bloquea el play automático, intentamos cargarlo
                console.log("Reintentando audio...");
                musica.load();
                musica.play();
            });

            document.getElementById('p1').style.display = 'none';
            document.getElementById('p2').style.display = 'flex';
            
            escribir('texto1', "Hoy es un día especial, y quiero pensar que este detalle está hecho a la altura del mismo.", 50, () => {
                document.getElementById('btn2').style.display = 'inline-block';
            });
        }

        function paso3() {
            document.getElementById('p2').style.display = 'none';
            setTimeout(() => {
                document.getElementById('p3').style.display = 'flex';
                escribir('texto2', "Hacer esto fue complicado, pero sabía que por ti valía la pena cada segundo invertido.", 50, () => {
                    document.getElementById('btn3').style.display = 'inline-block';
                });
            }, 2500);
        }

        function paso4() {
            const flash = document.getElementById('flash-overlay');
            flash.style.display = 'block';
            
            let flashes = 0;
            const intervalo = setInterval(() => {
                flash.style.opacity = flash.style.opacity == '0' ? '1' : '0';
                flashes++;
                if (flashes > 6) {
                    clearInterval(intervalo);
                    flash.style.display = 'none';
                    mostrarCarta();
                }
            }, 100);
        }

        function mostrarCarta() {
            document.getElementById('p3').style.display = 'none';
            document.getElementById('p4').style.display = 'flex';
            
            const cartaCompleta = "Desde que nuestra amistad comenzó, me he dado cuenta de que personas como tú no se encuentran todos los días. Hoy el mundo celebra que naciste, y yo celebro la suerte de tenerte en mi vida. Escribir estas palabras es intentar agradecerte por cada risa, por cada consejo y por estar ahí cuando más se necesita.\n\nMe detengo a pensar en todo lo que hemos compartido y no puedo evitar sonreír. Eres una persona auténtica, de esas que iluminan cualquier lugar con su energía y que siempre tienen la palabra justa. Eres, sin duda, una de mis personas favoritas.\n\nHacer este pequeño detalle fue un reto, pero cada segundo invertido valió la pena solo por imaginar tu reacción al verlo. Gracias por ser la increíble amiga que eres y por dejarme ser parte de tu historia. Espero que este nuevo año de vida esté lleno de éxitos, alegrías y momentos que te hagan tan feliz como tú haces a quienes te rodean. ¡Feliz cumpleaños!";

            escribir('carta', cartaCompleta, 40);
        }</script>
</body>
</html>
